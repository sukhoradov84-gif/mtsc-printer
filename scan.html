<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МТСК · Заказ запчасти</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #EEF1F6; color: #16233F;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff; border-radius: 4px;
      box-shadow: 0 4px 20px rgba(22,35,63,0.12);
      padding: 28px 24px; width: 100%; max-width: 400px;
      border-top: 4px solid #C43E1D; text-align: center;
    }
    .eyebrow {
      font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 2px; color: #6B7686; text-transform: uppercase; margin-bottom: 4px;
    }
    .order-id {
      font-family: 'Courier New', monospace; font-size: 22px;
      font-weight: 700; margin-bottom: 8px;
    }
    .sub { font-size: 13px; color: #6B7686; margin-bottom: 24px; line-height: 1.5; }
    .tear-line { border-bottom: 2px dashed #D9E0EA; margin: 20px 0; }
    .btn {
      display: block; width: 100%; padding: 14px; border: none;
      border-radius: 3px; font-size: 14px; font-weight: 700;
      letter-spacing: 0.3px; cursor: pointer; margin-bottom: 10px;
      text-transform: uppercase; font-family: inherit;
      text-decoration: none; text-align: center;
    }
    .btn-primary { background: #16233F; color: #fff; }
    .btn-primary:hover { background: #223259; }
    .btn-secondary { background: #EEF1F6; color: #16233F; border: 1px solid #D9E0EA; }
    .btn-secondary:hover { border-color: #16233F; }
    .hint { font-size: 11px; color: #6B7686; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card">
  <div class="eyebrow">МТСК · Складской модуль</div>
  <div class="order-id" id="orderIdDisplay">—</div>
  <div class="sub" id="subText">QR-код запчасти</div>
  <div class="tear-line"></div>
  <div id="buttons"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
  // URL кабинетов
  const ENGINEER_APP_URL  = 'https://script.google.com/macros/s/AKfycbwipZLCMyByQDkVqs_j_LOuTcd8xGTr6OMGi3DgOsU8d6rFAXWZFRGmJskU2Q4AdjNr/exec';
  const WAREHOUSE_APP_URL = 'https://script.google.com/macros/s/AKfycbz0vr8KEFsXgRBU6sZ_mfQFTdmRAnXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/exec'; // замени на реальный URL

  const params  = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId') || '';

  document.getElementById('orderIdDisplay').textContent = orderId || '(ID не указан)';

  if (!orderId) {
    document.getElementById('subText').innerHTML = '<span style="color:#C43E1D">ID заказа не указан.<br>Используйте QR-код с наклейки.</span>';
  } else {
    document.getElementById('subText').textContent = 'Выберите кабинет для просмотра карточки заказа:';

    const viewUrl      = ENGINEER_APP_URL  + '?action=view_order&orderId=' + encodeURIComponent(orderId);
    const warehouseUrl = WAREHOUSE_APP_URL + '?action=view_order&orderId=' + encodeURIComponent(orderId);

    document.getElementById('buttons').innerHTML =
      '<a class="btn btn-primary"   href="' + viewUrl      + '">👷 Открыть в кабинете инженера</a>' +
      '<a class="btn btn-secondary" href="' + warehouseUrl + '">📦 Открыть в складском кабинете</a>';

    document.getElementById('hint').innerHTML =
      'Инженеры — первая кнопка.<br>' +
      'Кладовщик — вторая кнопка.<br>' +
      'Кнопки подтверждения будут внутри карточки заказа.';
  }
</script>
</body>
</html>
