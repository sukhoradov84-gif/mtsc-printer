<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МТСК · Печать наклейки</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #EEF1F6; color: #16233F;
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 4px;
      box-shadow: 0 4px 20px rgba(22,35,63,0.12);
      padding: 28px 28px 24px; width: 100%; max-width: 400px;
      border-top: 4px solid #C43E1D;
    }
    .eyebrow {
      font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 2px; color: #6B7686; text-transform: uppercase;
      margin-bottom: 4px; text-align: center;
    }
    h1 { font-size: 18px; font-weight: 700; text-transform: uppercase;
         letter-spacing: 0.5px; margin-bottom: 16px; text-align: center; }

    /* Тип наклейки */
    .type-tabs { display: flex; gap: 0; margin-bottom: 16px; border: 1px solid #D9E0EA; border-radius: 3px; overflow: hidden; }
    .type-tab {
      flex: 1; padding: 9px 4px; border: none; background: #F5F7FC;
      font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
      text-transform: uppercase; letter-spacing: 0.3px; color: #6B7686;
      border-right: 1px solid #D9E0EA; transition: background 0.15s;
    }
    .type-tab:last-child { border-right: none; }
    .type-tab.active { background: #16233F; color: #fff; }

    /* Поля данных */
    .fields { margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.3px; color: #6B7686; margin-bottom: 3px;
    }
    .field input {
      width: 100%; padding: 8px 10px; border: 1px solid #D9E0EA;
      border-radius: 3px; font-size: 13px; font-family: inherit;
    }
    .field input:focus { outline: none; border-color: #16233F; }

    /* Предпросмотр наклейки */
    .preview-wrap {
      border: 1px solid #D9E0EA; border-radius: 3px; background: #fff;
      margin-bottom: 14px; display: flex; align-items: center;
      justify-content: center; overflow: hidden; min-height: 120px;
    }
    #labelPreviewCanvas { display: block; }

    /* Размер ленты */
    .tape-section { margin-bottom: 14px; }
    .tape-section label {
      display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.3px; color: #6B7686; margin-bottom: 6px;
    }
    .tape-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .tape-btn {
      padding: 5px 10px; border: 1px solid #D9E0EA; border-radius: 3px;
      background: #F5F7FC; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: 'Courier New', monospace; color: #16233F;
    }
    .tape-btn.active { background: #16233F; color: #fff; border-color: #16233F; }
    .tape-custom { display: flex; gap: 6px; margin-top: 6px; }
    .tape-custom input {
      flex: 1; padding: 5px 8px; border: 1px solid #D9E0EA;
      border-radius: 3px; font-size: 12px; text-align: center;
    }

    /* Кнопки */
    .btn {
      display: block; width: 100%; padding: 11px; border: none; border-radius: 3px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer;
      margin-bottom: 8px; text-transform: uppercase; font-family: inherit;
    }
    .btn-primary { background: #16233F; color: #fff; }
    .btn-primary:hover { background: #223259; }
    .btn-primary:disabled { background: #B7BFC8; cursor: default; }
    .btn-teal { background: #1F7A5C; color: #fff; }
    .btn-teal:hover { background: #185f47; }
    .btn-secondary { background: #EEF1F6; color: #16233F; border: 1px solid #D9E0EA; }
    .btn-secondary:hover { border-color: #16233F; }

    .status { margin-top: 8px; font-size: 12.5px; min-height: 18px; color: #6B7686; text-align: center; }
    .status.ok  { color: #1F7A5C; }
    .status.err { color: #C43E1D; }
    .status.info{ color: #2B5FA8; }

    .tear-line { border-bottom: 2px dashed #C7CFDC; margin: 14px 0; }
    #libStatus { font-size: 11px; color: #6B7686; margin-bottom: 8px; text-align: center; min-height: 14px; }
    .hint { font-size: 11px; color: #6B7686; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <div class="eyebrow">МТСК · Складской модуль</div>
  <h1>🖨️ Печать наклейки</h1>

  <!-- Тип наклейки -->
  <div class="type-tabs">
    <button class="type-tab active" id="tab-rem" onclick="setType('rem')">🔧 Ремонт</button>
    <button class="type-tab" id="tab-part" onclick="setType('part')">📦 Запчасть</button>
    <button class="type-tab" id="tab-order" onclick="setType('order')">🛒 Заказ</button>
  </div>

  <!-- Поля -->
  <div class="fields" id="fieldsBlock"></div>

  <!-- Предпросмотр -->
  <div class="preview-wrap" id="previewWrap">
    <canvas id="labelPreviewCanvas"></canvas>
  </div>

  <!-- Размер ленты -->
  <div class="tape-section">
    <label>Размер ленты (мм × мм → px)</label>
    <div class="tape-grid" id="tapeGrid"></div>
    <div class="tape-custom">
      <input type="number" id="customW" placeholder="Ш px" min="48" max="576">
      <input type="number" id="customH" placeholder="В px" min="48" max="960">
      <button class="tape-btn" onclick="applyCustomSize()">✓</button>
    </div>
  </div>

  <div class="tear-line"></div>

  <div id="libStatus">Загрузка библиотеки принтера...</div>
  <button class="btn btn-primary" id="connectBtn" onclick="connectPrinter()" disabled>🔵 Подключить B1</button>
  <button class="btn btn-teal"    id="printBtn"   onclick="printLabel()"    disabled>🖨️ Напечатать</button>
  <button class="btn btn-secondary"               onclick="updatePreview()">🔄 Обновить превью</button>
  <div class="status" id="status">Инициализация...</div>

  <div class="tear-line"></div>
  <div class="hint">
    Работает только в <strong>Chrome</strong> на ПК или Android.<br>
    Bluetooth должен быть включён. Принтер — в зоне видимости.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">

// ============================================================
// КОНСТАНТЫ
// ============================================================
const ENGINEER_APP_URL   = 'https://script.google.com/macros/s/AKfycbwipZLCMyByQDkVqs_j_LOuTcd8xGTr6OMGi3DgOsU8d6rFAXWZFRGmJskU2Q4AdjNr/exec';
const WAREHOUSE_APP_URL  = 'https://script.google.com/macros/s/WAREHOUSE_DEPLOY_ID/exec'; // заменить при деплое

// Размерная сетка Niimbot B1: [ширина мм, высота мм, ширина px, высота px]
const TAPE_SIZES = [
  { label: '40×40', w: 320, h: 320 },
  { label: '40×30', w: 320, h: 240 },
  { label: '40×12', w: 320, h:  96 },
  { label: '50×30', w: 400, h: 240 },
  { label: '60×40', w: 480, h: 320 },
];

// Схема полей для каждого типа наклейки
const TYPE_FIELDS = {
  rem: [
    { id: 'f_id',   label: 'ID ремонта',   placeholder: 'REM-0001' },
    { id: 'f_name', label: 'Наименование', placeholder: 'Дефибриллятор ДКИ-Н-10' },
    { id: 'f_lpu',  label: 'ЛПУ',          placeholder: 'ГП 78' },
  ],
  part: [
    { id: 'f_id',      label: 'ID запчасти',  placeholder: 'PART-0001' },
    { id: 'f_name',    label: 'Наименование', placeholder: 'Аккумулятор Delta 12V' },
    { id: 'f_article', label: 'Артикул',      placeholder: 'DTM12022' },
  ],
  order: [
    { id: 'f_id',   label: 'ID заказа',    placeholder: 'ORD-00041' },
    { id: 'f_name', label: 'Описание',     placeholder: 'Кабель ЭКГ Nihon Kohden' },
  ],
};

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let currentType   = 'rem';
let currentW      = 320;
let currentH      = 320;
let client        = null;
let NiimbotBluetoothClient = null;
let ImageEncoder           = null;

// ============================================================
// УТИЛИТЫ
// ============================================================
function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function getFieldVal(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function buildQrUrl() {
  const id = getFieldVal('f_id');
  if (!id) return '';
  if (currentType === 'rem')   return ENGINEER_APP_URL   + '?repairId='  + encodeURIComponent(id);
  if (currentType === 'part')  return WAREHOUSE_APP_URL  + '?partId='    + encodeURIComponent(id);
  if (currentType === 'order') return ENGINEER_APP_URL   + '?action=view_order&orderId=' + encodeURIComponent(id);
  return '';
}

// ============================================================
// ТИПЫ — рендер полей
// ============================================================
window.setType = function(type) {
  currentType = type;
  document.querySelectorAll('.type-tab').forEach(b => b.classList.toggle('active', b.id === 'tab-' + type));
  renderFields();
  updatePreview();
};

function renderFields() {
  const block = document.getElementById('fieldsBlock');
  const fields = TYPE_FIELDS[currentType] || [];
  block.innerHTML = fields.map(f =>
    `<div class="field">
      <label>${f.label}</label>
      <input type="text" id="${f.id}" placeholder="${f.placeholder}" oninput="updatePreview()">
    </div>`
  ).join('');
  // Если URL передал параметры — подставляем
  const params = new URLSearchParams(window.location.search);
  if (currentType === 'rem' && params.get('repairId')) {
    const el = document.getElementById('f_id');
    if (el) el.value = params.get('repairId');
  }
  if (currentType === 'part' && params.get('partId')) {
    const el = document.getElementById('f_id');
    if (el) el.value = params.get('partId');
  }
  if (currentType === 'order' && params.get('orderId')) {
    const el = document.getElementById('f_id');
    if (el) el.value = params.get('orderId');
  }
  // доп поля из URL
  const nameEl = document.getElementById('f_name');
  if (nameEl && params.get('name')) nameEl.value = params.get('name');
  const lpuEl  = document.getElementById('f_lpu');
  if (lpuEl  && params.get('lpu'))  lpuEl.value  = params.get('lpu');
  const artEl  = document.getElementById('f_article');
  if (artEl  && params.get('article')) artEl.value = params.get('article');
}

// ============================================================
// РАЗМЕР ЛЕНТЫ
// ============================================================
function renderTapeGrid() {
  const grid = document.getElementById('tapeGrid');
  grid.innerHTML = TAPE_SIZES.map((s, i) =>
    `<button class="tape-btn${i === 0 ? ' active' : ''}" onclick="selectTape(${i})" id="tape-${i}">${s.label}</button>`
  ).join('');
}

window.selectTape = function(i) {
  document.querySelectorAll('.tape-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tape-' + i).classList.add('active');
  currentW = TAPE_SIZES[i].w;
  currentH = TAPE_SIZES[i].h;
  updatePreview();
};

window.applyCustomSize = function() {
  const w = parseInt(document.getElementById('customW').value);
  const h = parseInt(document.getElementById('customH').value);
  if (!w || !h || w < 48 || h < 48) { alert('Укажите корректный размер (мин. 48px)'); return; }
  document.querySelectorAll('.tape-btn').forEach(b => b.classList.remove('active'));
  currentW = w; currentH = h;
  updatePreview();
};

// ============================================================
// ПРЕВЬЮ НАКЛЕЙКИ
// ============================================================
window.updatePreview = function() {
  const canvas  = document.getElementById('labelPreviewCanvas');
  const qrUrl   = buildQrUrl();
  const id      = getFieldVal('f_id');
  const name    = getFieldVal('f_name');
  const sub     = currentType === 'rem'  ? getFieldVal('f_lpu') :
                  currentType === 'part' ? getFieldVal('f_article') : '';

  // Масштаб для превью — не больше 300px по большей стороне
  const scale   = Math.min(300 / currentW, 300 / currentH, 1);
  const pw = Math.round(currentW * scale);
  const ph = Math.round(currentH * scale);
  canvas.width  = pw;
  canvas.height = ph;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, pw, ph);

  if (!id || !qrUrl) {
    ctx.fillStyle = '#D9E0EA';
    ctx.font = '12px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('Заполните поля', pw / 2, ph / 2);
    return;
  }

  // Генерируем QR во временный div
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
  document.body.appendChild(tmp);
  const qrMax = Math.min(pw, ph);
  new QRCode(tmp, {
    text: qrUrl, width: qrMax, height: qrMax,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  setTimeout(() => {
    const img = tmp.querySelector('img') || tmp.querySelector('canvas');
    const drawQr = (src) => {
      document.body.removeChild(tmp);
      drawLabelOnCanvas(ctx, pw, ph, src, id, name, sub);
    };
    if (!img) { document.body.removeChild(tmp); return; }
    if (img.tagName === 'CANVAS') { drawQr(img); }
    else if (img.complete) { drawQr(img); }
    else { img.onload = () => drawQr(img); }
  }, 250);
};

// ============================================================
// ЕДИНАЯ ФУНКЦИЯ ОТРИСОВКИ НАКЛЕЙКИ
// ============================================================
function drawLabelOnCanvas(ctx, w, h, qrImg, id, name, sub) {
  const FONT = 'Courier New, monospace';
  const PAD  = Math.round(Math.min(w, h) * 0.05);
  const GAP  = Math.round(Math.min(w, h) * 0.03);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  if (w > h) {
    // ── ГОРИЗОНТАЛЬНАЯ ЛЕНТА: QR слева, текст справа ──
    const qrSize = h - PAD;          // QR чуть меньше — отступ только сверху/снизу
    const qrX    = 0;                // вплотную к левому краю
    const qrY    = Math.round((h - qrSize) / 2);
    ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

    const textX    = qrSize + PAD;
    const maxTextW = w - textX - PAD;

    const idSize   = Math.round(h * 0.17);
    const nameSize = Math.round(h * 0.13);
    const subSize  = Math.round(h * 0.12);

    // Разбиваем все строки с учётом maxTextW
    const splitLines = (text, fontSize) => {
      ctx.font = `bold ${fontSize}px ${FONT}`;
      const lines = [];
      let line = '';
      for (const word of text.split(' ')) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxTextW && line) {
          lines.push(line); line = word;
        } else { line = test; }
      }
      if (line) lines.push(line);
      return lines;
    };

    const idLines   = splitLines(id,   idSize);
    const nameLines = splitLines(name, nameSize);
    const subLines  = sub ? splitLines(sub, subSize) : [];

    // Считаем общую высоту для вертикального центрирования
    const lH_id   = Math.round(idSize   * 1.25);
    const lH_name = Math.round(nameSize * 1.25);
    const lH_sub  = Math.round(subSize  * 1.25);
    const totalH  = idLines.length   * lH_id
                  + nameLines.length * lH_name
                  + (subLines.length ? GAP + subLines.length * lH_sub : 0);
    let ty = Math.round((h - totalH) / 2) + idSize;

    ctx.fillStyle = '#000000';
    ctx.textAlign = 'left';

    ctx.font = `bold ${idSize}px ${FONT}`;
    for (const l of idLines)   { ctx.fillText(l, textX, ty, maxTextW); ty += lH_id; }

    ctx.font = `bold ${nameSize}px ${FONT}`;
    for (const l of nameLines) { ctx.fillText(l, textX, ty, maxTextW); ty += lH_name; }

    if (subLines.length) {
      ty += GAP;
      ctx.font = `bold ${subSize}px ${FONT}`;
      for (const l of subLines) { ctx.fillText(l, textX, ty, maxTextW); ty += lH_sub; }
    }

  } else {
    // ── ВЕРТИКАЛЬНАЯ / КВАДРАТНАЯ: QR сверху, текст снизу ──
    const idSize   = Math.round(Math.min(w, h) * 0.088);
    const nameSize = Math.round(Math.min(w, h) * 0.074);
    const subSize  = Math.round(Math.min(w, h) * 0.065);
    const maxTextW = w - PAD * 2;

    ctx.font = `bold ${nameSize}px ${FONT}`;
    const nameLines = [];
    let line = '';
    for (const word of name.split(' ')) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxTextW && line) {
        nameLines.push(line); line = word;
      } else { line = test; }
    }
    if (line) nameLines.push(line);

    const lH_id   = Math.round(idSize   * 1.2);
    const lH_name = Math.round(nameSize * 1.2);
    const lH_sub  = Math.round(subSize  * 1.2);
    const textH   = lH_id
                  + GAP + nameLines.length * lH_name
                  + (sub ? GAP + lH_sub : 0);

    const qrAvail = h - PAD * 2 - GAP - textH;
    const qrSize  = Math.max(Math.min(qrAvail, w - PAD * 2), 32);
    const qrX     = Math.round((w - qrSize) / 2);
    const qrY     = PAD;
    ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

    let ty = qrY + qrSize + GAP + idSize;
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'center';

    ctx.font = `bold ${idSize}px ${FONT}`;
    ctx.fillText(id, w / 2, ty, maxTextW);
    ty += lH_id + GAP;

    ctx.font = `bold ${nameSize}px ${FONT}`;
    for (const l of nameLines) {
      ctx.fillText(l, w / 2, ty, maxTextW);
      ty += lH_name;
    }

    if (sub) {
      ty += GAP;
      ctx.font = `bold ${subSize}px ${FONT}`;
      ctx.fillText(sub, w / 2, ty, maxTextW);
    }
  }
}

// ============================================================
// ПЕЧАТЬ — canvas для принтера (полный размер)
// ============================================================
function buildPrintCanvas() {
  return new Promise((resolve, reject) => {
    const qrUrl = buildQrUrl();
    const id    = getFieldVal('f_id');
    const name  = getFieldVal('f_name');
    const sub   = currentType === 'rem'  ? getFieldVal('f_lpu') :
                  currentType === 'part' ? getFieldVal('f_article') : '';
    if (!qrUrl || !id) { reject(new Error('Заполните поля')); return; }

    const canvas = document.createElement('canvas');
    canvas.width  = currentW;
    canvas.height = currentH;
    const ctx = canvas.getContext('2d');

    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
    document.body.appendChild(tmp);
    // QR генерируем максимальным — drawLabelOnCanvas сам посчитает нужный размер
    const qrMax = Math.min(currentW, currentH);
    new QRCode(tmp, {
      text: qrUrl, width: qrMax, height: qrMax,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(() => {
      const img = tmp.querySelector('img') || tmp.querySelector('canvas');
      if (!img) { document.body.removeChild(tmp); reject(new Error('QR не сгенерирован')); return; }
      const draw = (src) => {
        document.body.removeChild(tmp);
        drawLabelOnCanvas(ctx, currentW, currentH, src, id, name, sub);
        resolve(canvas);
      };
      if (img.tagName === 'CANVAS') { draw(img); }
      else if (img.complete) { draw(img); }
      else { img.onload = () => draw(img); img.onerror = () => { document.body.removeChild(tmp); reject(new Error('Ошибка QR')); }; }
    }, 300);
  });
}

// ============================================================
// BLUETOOTH — подключение и печать
// ============================================================
async function loadLib() {
  try {
    const lib = await import('./niimbluelib.esm.js');
    NiimbotBluetoothClient = lib.NiimbotBluetoothClient;
    ImageEncoder           = lib.ImageEncoder;
  } catch(e) {
    const lib = await import('https://esm.sh/@mmote/niimbluelib@0.0.1-alpha.40');
    NiimbotBluetoothClient = lib.NiimbotBluetoothClient;
    ImageEncoder           = lib.ImageEncoder;
  }
  if (NiimbotBluetoothClient && ImageEncoder) {
    document.getElementById('libStatus').textContent = '✅ Библиотека загружена';
    document.getElementById('connectBtn').disabled = false;
    setStatus('Нажмите «Подключить B1»', '');
  } else {
    document.getElementById('libStatus').textContent = '❌ Не удалось загрузить библиотеку';
    setStatus('Ошибка загрузки библиотеки', 'err');
  }
}

window.connectPrinter = async function() {
  if (!NiimbotBluetoothClient) { setStatus('Библиотека не загружена', 'err'); return; }
  if (!navigator.bluetooth) { setStatus('Web Bluetooth не поддерживается — используйте Chrome', 'err'); return; }
  const btn = document.getElementById('connectBtn');
  btn.disabled = true; btn.textContent = '⏳ Подключение...';
  setStatus('Выберите принтер в диалоге браузера...', 'info');
  try {
    client = new NiimbotBluetoothClient();
    client.on('connect', () => {
      setStatus('✅ Принтер подключён!', 'ok');
      document.getElementById('printBtn').disabled = false;
      btn.textContent = '✅ B1 подключён';
    });
    client.on('disconnect', () => {
      setStatus('Принтер отключён', '');
      document.getElementById('printBtn').disabled = true;
      btn.disabled = false; btn.textContent = '🔵 Подключить B1';
      client = null;
    });
    let lastErr;
    for (let i = 1; i <= 3; i++) {
      try {
        if (i > 1) { setStatus(`Повторное подключение (${i}/3)...`, 'info'); await new Promise(r => setTimeout(r, 1500)); }
        await client.connect(); lastErr = null; break;
      } catch(e) {
        lastErr = e;
        const isGatt = e.message && (e.message.includes('GATT') || e.message.includes('gatt') || e.message.includes('timeout'));
        if (!isGatt || i === 3) break;
      }
    }
    if (lastErr) throw lastErr;
  } catch(e) {
    setStatus('Ошибка: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '🔵 Подключить B1'; client = null;
  }
};

window.printLabel = async function() {
  if (!client) { setStatus('Принтер не подключён', 'err'); return; }
  const btn = document.getElementById('printBtn');
  btn.disabled = true; btn.textContent = '⏳ Печать...';
  setStatus('Подготовка изображения...', 'info');
  try {
    const canvas = await buildPrintCanvas();
    setStatus('Отправка на принтер...', 'info');
    const printTaskType = client.getPrintTaskType();
    if (!printTaskType) throw new Error('Не удалось определить тип задачи для этой модели');
    const printTask = client.abstraction.newPrintTask(printTaskType, {
      quantity: 1, labelType: 1, density: 3, totalPages: 1,
    });
    const encodedImage = ImageEncoder.encodeCanvas(canvas, 'top');
    await printTask.printInit();
    await printTask.printPage(encodedImage);
    await printTask.waitForFinished();
    await printTask.printEnd();
    setStatus('✅ Наклейка распечатана!', 'ok');
  } catch(e) {
    setStatus('Ошибка печати: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '🖨️ Напечатать';
  }
};

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
window.addEventListener('load', function() {
  renderTapeGrid();
  // Определяем тип из URL-параметров
  const params = new URLSearchParams(window.location.search);
  if (params.get('repairId'))  currentType = 'rem';
  else if (params.get('partId'))  currentType = 'part';
  else if (params.get('orderId')) currentType = 'order';

  document.querySelectorAll('.type-tab').forEach(b => b.classList.toggle('active', b.id === 'tab-' + currentType));
  renderFields();
  updatePreview();

  loadLib().catch(e => {
    document.getElementById('libStatus').textContent = '❌ ' + e.message;
    setStatus('Ошибка загрузки библиотеки', 'err');
  });
});
</script>
